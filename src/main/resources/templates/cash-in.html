<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ePon - Cash In</title>
    <style>
        body {
            background:
                    url('/images/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(128, 0, 128, 0.15); width: 100%; max-width: 400px; border-top: 5px solid rgb(128, 0, 128); }
        input[type="number"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 20px;
            color: black;
            box-sizing: border-box;
        }

        input::placeholder {
            font-size: 14px;
            color: lightgray;
        }
        h2 { color: rgb(128, 0, 128); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: rgb(100, 0, 100); font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: rgb(128, 0, 128); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: rgb(100, 0, 100); }
        .back-link { display: block; text-align: center; margin-top: 15px; color: rgb(128, 0, 128); text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Cash-In Funds</h2>
    <form th:action="@{/cash-in}" method="post">
        <div class="form-group">
            <label>Amount (₱) :</label>
            <input type="number" step="0.01" min="1" name="amount" placeholder="Enter Amount" required>
        </div>
        <button type="submit">Confirm</button>
    </form>
    <a class="back-link" th:href="@{/dashboard}">&larr; Back to Dashboard</a>
</div>
</body>
</html>
