<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ePon - Login</title>
    <style>
        body {
            background:
            url('/images/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            min-height: 480px;
            background: white;
            padding: 40px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(128, 0, 128, 0.25);
            border-top: 6px solid rgb(128, 0, 128);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 20px;
            color: black;
            box-sizing: border-box;
        }

        input::placeholder {
            font-size: 14px;
            color: lightgray;
        }
        h2 { color: rgb(128, 0, 128); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: rgb(100, 0, 100); font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: rgb(128, 0, 128); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: rgb(100, 0, 100); }
        .alert-error { background-color: #ffe6e6; color: #cc0000; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .alert-success { background-color: #e6ffe6; color: #006600; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
        .links a { color: rgb(128, 0, 128); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <div style="text-align: center; margin-bottom: 25px;">
        <img th:src="@{/images/logo.png}" alt="ePon Logo" style="max-height: 250px; width: auto;">
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" name="mobileNumber" placeholder="Enter Mobile Number" required>
        </div>
        <div class="form-group">
            <label>PIN</label>
            <input type="password" name="pin" placeholder="Enter PIN" required>
        </div>
        <button type="submit">Log In</button>
    </form>
    <div class="links">
        <p>Don't have an account? <a th:href="@{/register}">Register Here.</a></p>
    </div>
</div>
</body>
</html>
